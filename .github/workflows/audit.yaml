name: Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# ローカルの `/audit` 推奨をバイパスされても CI で同じ品質ゲートを通す。
# 失敗しても merge ブロックはしない (warning レベル、 別の job で main CI を維持)。
jobs:
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: knip (unused exports / files / dependencies)
        # workspace 全体を見るためルートで実行する (設定はルートの knip.json)
        run: pnpm dlx knip --no-config-hints --reporter symbols
        working-directory: .
        continue-on-error: true

      - name: jscpd (duplicate code detection)
        run: pnpm dlx jscpd src --min-tokens 50 --reporters consoleSummary
        continue-on-error: true

      - name: madge (circular dependencies)
        # 拡張子と `$lib` の別名は apps/web/.madgerc で渡す。madge は baseUrl のない tsconfig の
        # paths を解決できず、SvelteKit が生成する tsconfig をそのまま渡すと `$lib/...` を辿れない
        run: pnpm dlx madge --circular src
        continue-on-error: true
