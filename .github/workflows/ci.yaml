name: CI

on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  id-token: write
  contents: read
  packages: read

env:
  AWS_ROLE_ARN: arn:aws:iam::831963379503:role/resource-planner-github-actions

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@tommykey-apps'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        working-directory: apps/web

      # Lambda Web Function の配布物を作り、Lambda と同じ Node の起動オプションで立ち上げて確かめる (ADR 0014)
      - name: Package Web Function
        run: pnpm package:web-function
        working-directory: apps/web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test Web Function package
        run: pnpm smoke:web-function
        working-directory: apps/web

  test:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ["8000:8000"]
        # NOTE: amazon/dynamodb-local image はシェルなしのため services.options で
        # --health-cmd を渡せない。後続ステップで wait ループする (db-docs.yaml と同じ)。
    env:
      AWS_ENDPOINT_URL: http://localhost:8000
      AWS_REGION: ap-northeast-1
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DYNAMODB_TABLE: resource-planner
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@tommykey-apps'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for DynamoDB Local
        run: |
          for i in {1..30}; do
            curl -s http://localhost:8000 > /dev/null && exit 0
            sleep 1
          done
          echo "DynamoDB Local did not start within 30s"
          exit 1

      # #186: create-table 定義は bin/create-ddb-table.sh に集約。
      - name: Create table
        run: ./bin/create-ddb-table.sh

      - name: Run tests
        run: pnpm test

  # Playwright E2E (#112)。 詳細: ADR 0007
  # スモークテスト (@smoke) と残りを別ジョブにする。 main の必須チェックには smoke だけを入れる。
  # Playwright 公式の「Via Containers」に従い、 ブラウザと依存パッケージ入りのイメージで動かす。
  # 実行時に apt で依存パッケージを入れないので、 Ubuntu の配布サーバーの不調で失敗しない。
  # Refs: https://playwright.dev/docs/ci#via-containers
  test-e2e:
    name: test-e2e (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: smoke
            filter: --grep @smoke
          - suite: rest
            filter: --grep-invert @smoke
    container:
      # 版は tests/e2e の @playwright/test と揃える (違うとブラウザの実行ファイルが見つからない)
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # --user 1001: 公式の例。 --init と --ipc=host: 公式が Chromium 用に推奨
      options: --user 1001 --init --ipc=host
    services:
      # ジョブがコンテナで動くので、 ポートの公開は不要。 サービス名 dynamodb で参照する。
      dynamodb:
        image: amazon/dynamodb-local:3.3.2
        # NOTE: image にシェルが無く services.options で health-cmd を渡せない。 後続ステップで待つ。
    env:
      AWS_ENDPOINT_URL: http://dynamodb:8000
      # playwright.config.ts が起動するアプリに渡す接続先
      E2E_DYNAMODB_ENDPOINT: http://dynamodb:8000
      AWS_REGION: ap-northeast-1
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DYNAMODB_TABLE: resource-planner
      # Auth.js を初期化するためのダミー値
      AUTH_SECRET: e2e-secret-not-for-production-padding-padding-padding
      AUTH_TRUST_HOST: 'true'
      ALLOWED_DOMAIN: example.com
      EMAIL_FROM: noreply@example.com
      # #113: dev sendVerificationRequest が magic link URL を書き出すファイル。
      # Playwright fixture がここから URL を取り出して sign-in flow を走らせる。
      AUTH_TEST_MAGIC_LINK_FILE: /tmp/playwright-magic-links.txt
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@tommykey-apps'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for DynamoDB Local
        run: |
          for i in {1..30}; do
            curl -s "$AWS_ENDPOINT_URL" > /dev/null && exit 0
            sleep 1
          done
          echo "DynamoDB Local did not start within 30s"
          exit 1

      # #186: create-table 定義は bin/create-ddb-table.sh に集約。
      # Playwright のイメージには aws CLI が無いので、 公式の aws CLI イメージで実行する。
      - name: Create table
        uses: docker://amazon/aws-cli:2.39.0
        env:
          ENDPOINT_URL: http://dynamodb:8000
        with:
          entrypoint: /bin/bash
          args: bin/create-ddb-table.sh

      - name: Build
        run: pnpm build
        working-directory: apps/web

      - name: Run E2E tests
        run: pnpm test:e2e ${{ matrix.filter }}
        working-directory: tests/e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.suite }}
          path: tests/e2e/playwright-report/
          retention-days: 7

  terraform-plan:
    runs-on: ubuntu-latest
    # Terraform の状態ファイルを共有する plan / apply は同時に1本だけ実行する
    # (HashiCorp 推奨: "allow only one plan to be outstanding at a time")。
    # 実行中の apply を止めないよう cancel-in-progress は false、待機中の実行も破棄しないよう queue: max。
    concurrency:
      group: terraform-state
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4

      # #134: SES bounce handler Lambda の bundle 必要。
      # `data "archive_file" "ses_bounce_handler"` が apps/ses-bounce/dist を参照するため、
      # terraform plan / validate 前に esbuild bundle を完了させる。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@tommykey-apps'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build SES bounce handler Lambda
        run: pnpm --filter @resource-planner/ses-bounce build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Terraform Init
        run: terraform init -reconfigure
        working-directory: infra

      - name: Terraform Validate
        run: terraform validate
        working-directory: infra

      - name: Terraform Plan
        run: terraform plan -input=false
        working-directory: infra
        env:
          TF_VAR_allowed_domain: ${{ secrets.ALLOWED_DOMAIN }}
